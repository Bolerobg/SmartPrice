<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="gold" x1="0.1" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset="0.38" stop-color="#f2bb2a"/>
      <stop offset="0.72" stop-color="#d99a12"/>
      <stop offset="1" stop-color="#8f5c10"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#0c8059"/>
      <stop offset="0.65" stop-color="#065843"/>
      <stop offset="1" stop-color="#03251d"/>
    </radialGradient>
    <path id="topArc" d="M128 128 m-88 0 a88 88 0 1 1 176 0" fill="none"/>
    <path id="botArc" d="M128 128 m-88 0 a88 88 0 1 0 176 0" fill="none"/>
  </defs>

  <!-- Златен ръб -->
  <circle cx="128" cy="128" r="126" fill="url(#gold)"/>
  <!-- Назъбен печат: 20 малки топчета по ръба -->
  <g fill="url(#gold)">
    <g id="dot"><circle cx="128" cy="9" r="5"/></g>
    <use href="#dot" transform="rotate(18 128 128)"/><use href="#dot" transform="rotate(36 128 128)"/>
    <use href="#dot" transform="rotate(54 128 128)"/><use href="#dot" transform="rotate(72 128 128)"/>
    <use href="#dot" transform="rotate(90 128 128)"/><use href="#dot" transform="rotate(108 128 128)"/>
    <use href="#dot" transform="rotate(126 128 128)"/><use href="#dot" transform="rotate(144 128 128)"/>
    <use href="#dot" transform="rotate(162 128 128)"/><use href="#dot" transform="rotate(180 128 128)"/>
    <use href="#dot" transform="rotate(198 128 128)"/><use href="#dot" transform="rotate(216 128 128)"/>
    <use href="#dot" transform="rotate(234 128 128)"/><use href="#dot" transform="rotate(252 128 128)"/>
    <use href="#dot" transform="rotate(270 128 128)"/><use href="#dot" transform="rotate(288 128 128)"/>
    <use href="#dot" transform="rotate(306 128 128)"/><use href="#dot" transform="rotate(324 128 128)"/>
    <use href="#dot" transform="rotate(342 128 128)"/>
  </g>

  <!-- Тъмнозелен диск -->
  <circle cx="128" cy="128" r="117" fill="url(#disc)"/>
  <circle cx="128" cy="128" r="105" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.85"/>

  <!-- Текст по горната дъга (радиус 88 → не пипа центъра) -->
  <text font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="900"
        fill="url(#gold)" letter-spacing="1.2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">ПРОВЕРЕН ТЪРГОВЕЦ</textPath>
  </text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700"
        fill="#ffe6a8" letter-spacing="3" opacity="0.9">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">SMARTPRICE · БЪЛГАРИЯ</textPath>
  </text>

  <!-- Център: тъмна плочка с голяма отметка -->
  <g transform="translate(128 130)">
    <path d="M0-48 L41-24 V24 L0 48 L-41 24 V-24 Z" fill="#02201a" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-20 1 L-6 16 L23 -17" fill="none" stroke="url(#gold)" stroke-width="12.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
