server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf font/woff2;

  # index.html никога не се кешира, за да се виждат новите версии веднага
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri =404;
  }

  # Номерът на билда — приложението го проверява, за да разбере, че има нова
  # версия. Никога не се кешира (иначе проверката не вижда нищо ново).
  location = /version.json {
    default_type application/json;
    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri =404;
  }

  # Хешираните файлове на Expo могат да се кешират дълго (имената им се менят при билд)
  location /_expo/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # Публичният дашборд с отворени данни (#13) — винаги свеж
  location /dane/ {
    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri $uri/ /dane/index.html;
  }

  # API-то
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 15m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # Качените снимки (сервират се от API-то)
  location /uploads/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  # Иконите на приложението и manifest-ът (иначе nginx не знае типа на .webmanifest)
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~* ^/(icon-192|icon-512|icon-512-maskable|apple-touch-icon|favicon)\.(png|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # Споделени оферти: ботовете на WhatsApp/Viber/Facebook/Telegram не
  # изпълняват JavaScript, затова им даваме малък HTML с Open Graph тагове
  # (иначе прегледът на линка е празен). Хората получават SPA-то както досега.
  # ВАЖНО: регулярният израз е в кавички — nginx иначе тълкува {36} като
  # начало на блок и чупи конфигурацията. Id-то се пази в $og_post_id, защото
  # `if`-ът по-долу презаписва позиционните групи ($1) със своите.
  location ~ "^/post/([0-9a-fA-F-]{36})/?$" {
    set $og_post_id $1;
    if ($http_user_agent ~* "(?:facebookexternalhit|Facebot|WhatsApp|TelegramBot|Telegram|Twitterbot|Viber|Slackbot|Discordbot|LinkedInBot|Pinterest|SkypeUriPreview|Googlebot|bingbot|Applebot|embedly|redditbot|vkShare|W3C_Validator|AhrefsBot|SemrushBot|DuckDuckBot|YandexBot|ia_archiver)") {
      proxy_pass http://api:4000/og/post/$og_post_id;
    }
    try_files $uri /index.html;
  }

  # Отделен админ панел (дашборд). Собствена страница, не е част от мобилното
  # приложение: влиза се с админски профил, всичко се пази на сървъра.
  location /panel {
    try_files $uri $uri/ /panel/index.html;
    add_header Cache-Control "no-store, must-revalidate";
  }

  # SPA fallback за expo-router (напр. /post/<id> при презареждане)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
